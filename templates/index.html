<!DOCTYPE html>
<html>
<head>
    <title>Chat Server</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            width: 90%;
            max-width: 520px;
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        .login-section, .chat-section { display: none; }
        .login-section.active, .chat-section.active { display: block; }
        .login-section { padding: 30px; background: #f8f9fa; }
        .chat-section {
            height: 620px;
            display: none;
            flex-direction: column;
        }
        .chat-section.active { display: flex; }
        h2 { text-align: center; margin-bottom: 20px; color: #333; }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover { background: #764ba2; }
        .chat-header {
            background: #667eea;
            color: white;
            padding: 15px;
            text-align: center;
        }
        .chat-header h2 { margin: 0; font-size: 20px; }
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            background: #f8f9fa;
        }
        .message {
            margin-bottom: 12px;
            padding: 10px;
            background: white;
            border-radius: 6px;
            border-left: 4px solid #667eea;
        }
        .message.system {
            border-left-color: #999;
            background: #e9ecef;
            font-style: italic;
            color: #666;
        }
        .message.private {
            border-left-color: #ffc107;
            background: #fff3cd;
        }
        .message strong { color: #667eea; }
        .message.private strong { color: #ff6b6b; }
        .message-time { font-size: 12px; color: #999; margin-top: 5px; }
        .input-area {
            display: flex;
            gap: 10px;
            padding: 15px;
            background: white;
            border-top: 1px solid #ddd;
        }
        .input-area input { margin: 0; flex: 1; }
        .input-area button { width: 90px; padding: 10px; }
        .media-upload {
            display: flex;
            gap: 8px;
            align-items: center;
            padding: 10px 15px;
            background: #f1f3f5;
            border-top: 1px solid #ddd;
        }
        .media-upload input[type=file] {
            width: auto;
            margin: 0;
            flex: 1;
            padding: 8px;
        }
        .media-upload button {
            width: 120px;
            padding: 10px;
            font-size: 14px;
        }
        .logout-btn {
            background: #ff6b6b;
            padding: 10px 20px;
            width: auto;
            margin: 10px 0 0 0;
        }
        .logout-btn:hover { background: #ff5252; }
        .error {
            color: #ff6b6b;
            background: #ffe0e0;
            border-radius: 5px;
            padding: 10px;
            display: none;
            margin-bottom: 10px;
        }
        .error.show { display: block; }
        .media-preview {
            max-width: 100%;
            max-height: 240px;
            border-radius: 8px;
            margin-top: 8px;
            display: block;
        }
        video.media-preview {
            width: 100%;
            max-height: 240px;
            background: #111;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="login-section active" id="loginSection">
            <h2>Chat Server Login</h2>
            <div class="error" id="loginError"></div>
            <input type="text" id="username" placeholder="Username" />
            <input type="password" id="password" placeholder="Password" />
            <button onclick="login()">Login</button>
        </div>

        <div class="chat-section" id="chatSection">
            <div class="chat-header">
                <h2>Chat - <span id="currentUser"></span></h2>
                <small>Tip: Use @username: message for private messages</small>
            </div>

            <div class="messages" id="messages"></div>

            <div class="media-upload">
                <input type="file" id="mediaUpload" accept="image/*,video/*" />
                <button onclick="uploadMedia()">Attach</button>
            </div>

            <div class="input-area">
                <input type="text" id="messageInput" placeholder="Type message..." onkeypress="handleKeyPress(event)" />
                <button onclick="sendMessage()">Send</button>
            </div>

            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>
    </div>

    <script>
        const socket = io();
        let currentUsername = '';

        socket.on('connect', () => { console.log('Connected'); });

        socket.on('login_response', (data) => {
            if (data.success) {
                currentUsername = document.getElementById('username').value;
                document.getElementById('currentUser').textContent = currentUsername;
                document.getElementById('loginSection').classList.remove('active');
                document.getElementById('chatSection').classList.add('active');
                document.getElementById('messages').innerHTML = '';
            } else {
                showLoginError(data.message);
            }
        });

        socket.on('chat_history', (data) => {
            const messages = data.messages || [];
            messages.forEach(msg => {
                if (msg.media_url) {
                    renderMediaMessage(msg);
                } else if (msg.type === 'system') {
                    addMessage(msg.content, 'system');
                } else if (msg.type === 'private') {
                    if (msg.sender === currentUsername) {
                        addMessage(`[DM to ${msg.recipient}]: ${msg.content}`, 'private', `to ${msg.recipient}`, msg.timestamp);
                    } else if (msg.recipient === currentUsername) {
                        addMessage(`[DM from ${msg.sender}]: ${msg.content}`, 'private', msg.sender, msg.timestamp);
                    }
                } else {
                    addMessage(`${msg.sender}: ${msg.content}`, 'regular', msg.sender, msg.timestamp);
                }
            });

            const messagesDiv = document.getElementById('messages');
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        });

        socket.on('message', (data) => {
            if (data.media_url) {
                renderMediaMessage({
                    sender: data.username,
                    content: '',
                    media_url: data.media_url,
                    media_type: data.media_type,
                    timestamp: data.timestamp
                });
            } else {
                addMessage(`${data.username}: ${data.message}`, 'regular', data.username, data.timestamp);
            }
        });

        socket.on('private_message', (data) => {
            if (data.media_url) {
                renderMediaMessage({
                    sender: data.from,
                    content: '',
                    media_url: data.media_url,
                    media_type: data.media_type,
                    timestamp: data.timestamp
                }, 'private');
            } else {
                addMessage(`[DM from ${data.from}]: ${data.message}`, 'private', data.from, data.timestamp);
            }
        });

        socket.on('private_message_sent', (data) => {
            addMessage(`[DM to ${data.to}]: ${data.message}`, 'private', `to ${data.to}`, data.timestamp);
        });

        socket.on('user_joined', (data) => addMessage(data.message, 'system'));
        socket.on('user_left', (data) => addMessage(data.message, 'system'));
        socket.on('error', (data) => showChatError(data.message));

        function renderMediaMessage(msg, forceType = null) {
            const messagesDiv = document.getElementById('messages');
            const messageEl = document.createElement('div');
            const type = forceType || 'regular';

            messageEl.className = `message ${type}`;

            if (type === 'system') {
                messageEl.innerHTML = msg.content;
            } else {
                const label = (msg.sender || msg.from || 'Media');
                const mediaHtml = msg.media_type === 'video'
                    ? `<video class="media-preview" controls src="${msg.media_url}"></video>`
                    : `<img class="media-preview" src="${msg.media_url}" />`;

                messageEl.innerHTML = `<strong>${label}</strong><br>${mediaHtml}`;
                if (msg.timestamp) {
                    messageEl.innerHTML += `<div class="message-time">${msg.timestamp}</div>`;
                }
            }
            messagesDiv.appendChild(messageEl);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function showLoginError(msg) {
            const errorDiv = document.getElementById('loginError');
            errorDiv.textContent = msg;
            errorDiv.classList.add('show');
            setTimeout(() => errorDiv.classList.remove('show'), 3000);
        }

        function showChatError(msg) {
            const messagesDiv = document.getElementById('messages');
            const errorEl = document.createElement('div');
            errorEl.className = 'message system';
            errorEl.innerHTML = `<strong>Error:</strong> ${msg}`;
            messagesDiv.appendChild(errorEl);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function addMessage(text, type = 'regular', user = '', time = '') {
            const messagesDiv = document.getElementById('messages');
            const messageEl = document.createElement('div');
            messageEl.className = `message ${type}`;

            if (type === 'system') {
                messageEl.innerHTML = text;
            } else {
                messageEl.innerHTML = `<strong>${user}</strong><br>${text}`;
                if (time) {
                    messageEl.innerHTML += `<div class="message-time">${time}</div>`;
                }
            }

            messagesDiv.appendChild(messageEl);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function login() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();

            if (!username || !password) {
                showLoginError('Please enter username and password');
                return;
            }

            socket.emit('login', { username, password });
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            if (!message) return;

            socket.emit('message', { message });
            input.value = '';
            input.focus();
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        async function uploadMedia() {
            const fileInput = document.getElementById('mediaUpload');
            const file = fileInput.files[0];
            if (!file) return;

            const formData = new FormData();
            formData.append('file', file);

            try {
                const res = await fetch('/upload_media', {
                    method: 'POST',
                    body: formData
                });

                const data = await res.json();
                if (data.error) {
                    alert(data.error);
                    return;
                }

                socket.emit('message', {
                    message: '',
                    media_url: data.url,
                    media_type: data.resource_type
                });
                fileInput.value = '';
            } catch (err) {
                alert('Upload failed: ' + err.message);
            }
        }

        function logout() {
            socket.disconnect();
            currentUsername = '';
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
            document.getElementById('messages').innerHTML = '';
            document.getElementById('loginSection').classList.add('active');
            document.getElementById('chatSection').classList.remove('active');
            socket.connect();
        }
    </script>
</body>
</html>
