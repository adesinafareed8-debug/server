<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Server</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Courier New', monospace;
            background: #0a0e27;
            color: #00ff41;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-shadow: 0 0 10px #00ff41;
        }
        .container {
            width: 90%;
            max-width: 520px;
            background: #0f1419;
            border-radius: 0;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0, 255, 65, 0.3), inset 0 0 20px rgba(0, 0, 0, 0.9);
            border: 2px solid #00ff41;
        }
        .login-section, .chat-section { display: none; }
        .login-section.active, .chat-section.active { display: block; }
        .login-section { 
            padding: 30px; 
            background: #0a0e27;
            border-bottom: 2px solid #00ff41;
        }
        .chat-section {
            height: 620px;
            display: none;
            flex-direction: column;
        }
        .chat-section.active { display: flex; }
        h2 { 
            text-align: center; 
            margin-bottom: 20px; 
            color: #00ff41;
            text-shadow: 0 0 10px #00ff41;
            font-size: 24px;
        }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #00ff41;
            background: #0f1419;
            color: #00ff41;
            border-radius: 0;
            font-size: 14px;
            font-family: 'Courier New', monospace;
            text-shadow: 0 0 5px #00ff41;
        }
        input:focus {
            outline: none;
            border-color: #00ff41;
            box-shadow: 0 0 15px rgba(0, 255, 65, 0.5), inset 0 0 10px rgba(0, 255, 65, 0.1);
            background: rgba(0, 255, 65, 0.05);
        }
        button {
            width: 100%;
            padding: 12px;
            background: #1a1f3a;
            color: #00ff41;
            border: 2px solid #00ff41;
            border-radius: 0;
            font-size: 16px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            text-transform: uppercase;
            font-weight: bold;
            transition: all 0.3s;
            text-shadow: 0 0 5px #00ff41;
        }
        button:hover { 
            background: #00ff41;
            color: #0a0e27;
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.6);
            text-shadow: none;
        }
        .chat-header {
            background: #0a0e27;
            color: #00ff41;
            padding: 15px;
            text-align: center;
            border-bottom: 2px solid #00ff41;
            text-shadow: 0 0 10px #00ff41;
        }
        .chat-header h2 { margin: 0; font-size: 20px; }
        .chat-header small { 
            display: block; 
            margin-top: 5px; 
            opacity: 0.8;
            color: #00cc33;
        }
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            background: #0f1419;
        }
        .message {
            margin-bottom: 12px;
            padding: 10px;
            background: #1a1f3a;
            border-radius: 0;
            border-left: 4px solid #00ff41;
            border: 1px solid #00ff41;
            color: #00ff41;
            text-shadow: 0 0 5px #00ff41;
        }
        .message.system {
            border-left-color: #00cc33;
            border-color: #00cc33;
            background: #0a0e27;
            font-style: italic;
            color: #00cc33;
            text-shadow: 0 0 5px #00cc33;
        }
        .message.private {
            border-left-color: #00ff41;
            border-color: #00ff41;
            background: rgba(0, 255, 65, 0.1);
        }
        .message strong { 
            color: #00ff41;
            text-shadow: 0 0 8px #00ff41;
        }
        .message.private strong { 
            color: #00ff41;
            text-shadow: 0 0 8px #00ff41;
        }
        .message-time { 
            font-size: 12px; 
            color: #00cc33; 
            margin-top: 5px;
            text-shadow: 0 0 5px #00cc33;
        }
        .input-area {
            display: flex;
            gap: 10px;
            padding: 15px;
            background: #0a0e27;
            border-top: 2px solid #00ff41;
        }
        .input-area input { margin: 0; flex: 1; }
        .input-area button { width: 90px; padding: 10px; }
        .media-upload {
            display: flex;
            gap: 8px;
            align-items: center;
            padding: 10px 15px;
            background: #0a0e27;
            border-top: 2px solid #00ff41;
        }
        .media-upload input[type=file] {
            width: auto;
            margin: 0;
            flex: 1;
            padding: 8px;
        }
        .media-upload button {
            width: 120px;
            padding: 10px;
            font-size: 14px;
        }
        .logout-btn {
            background: #2a1a1a;
            border-color: #ff4444;
            color: #ff4444;
            padding: 10px 20px;
            width: auto;
            margin: 10px 15px 0 15px;
            text-shadow: 0 0 5px #ff4444;
        }
        .logout-btn:hover { 
            background: #ff4444;
            color: #0a0e27;
            text-shadow: none;
            box-shadow: 0 0 20px rgba(255, 68, 68, 0.6);
        }
        .error {
            color: #ff4444;
            background: rgba(255, 68, 68, 0.2);
            border: 1px solid #ff4444;
            border-radius: 0;
            padding: 10px;
            display: none;
            margin-bottom: 10px;
            text-shadow: 0 0 5px #ff4444;
        }
        .error.show { display: block; }
        .media-preview {
            max-width: 100%;
            max-height: 240px;
            border-radius: 0;
            margin-top: 8px;
            display: block;
            border: 1px solid #00ff41;
        }
        video.media-preview {
            width: 100%;
            max-height: 240px;
            background: #000;
            border: 1px solid #00ff41;
        }
        ::-webkit-scrollbar {
            width: 10px;
        }
        ::-webkit-scrollbar-track {
            background: #0a0e27;
        }
        ::-webkit-scrollbar-thumb {
            background: #00ff41;
            border-radius: 0;
            box-shadow: 0 0 10px #00ff41;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #00cc33;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="login-section active" id="loginSection">
            <h2>[ CHAT SERVER ]</h2>
            <div class="error" id="loginError"></div>
            <input type="text" id="username" placeholder="> username" />
            <input type="password" id="password" placeholder="> password" />
            <button onclick="login()">[ LOGIN ]</button>
        </div>

        <div class="chat-section" id="chatSection">
            <div class="chat-header">
                <h2>[ CHAT - <span id="currentUser"></span> ]</h2>
                <small>> Use @username: message for private messages</small>
            </div>

            <div class="messages" id="messages"></div>

            <div class="media-upload">
                <input type="file" id="mediaUpload" accept="image/*,video/*" />
                <button onclick="uploadMedia()">[ ATTACH ]</button>
            </div>

            <div class="input-area">
                <input type="text" id="messageInput" placeholder="> message..." onkeypress="handleKeyPress(event)" />
                <button onclick="sendMessage()">[ SEND ]</button>
            </div>

            <button class="logout-btn" onclick="logout()">[ LOGOUT ]</button>
        </div>
    </div>

    <script>
        const socket = io();
        let currentUsername = '';

        socket.on('connect', () => { console.log('[+] Connected'); });

        socket.on('login_response', (data) => {
            if (data.success) {
                currentUsername = document.getElementById('username').value;
                document.getElementById('currentUser').textContent = currentUsername;
                document.getElementById('loginSection').classList.remove('active');
                document.getElementById('chatSection').classList.add('active');
                document.getElementById('messages').innerHTML = '';
            } else {
                showLoginError(data.message);
            }
        });

        socket.on('chat_history', (data) => {
            const messages = data.messages || [];
            messages.forEach(msg => {
                if (msg.media_url) {
                    renderMediaMessage(msg);
                } else if (msg.type === 'system') {
                    addMessage(msg.content, 'system');
                } else if (msg.type === 'private') {
                    if (msg.sender === currentUsername) {
                        addMessage(`[DM to ${msg.recipient}]: ${msg.content}`, 'private', `to ${msg.recipient}`, msg.timestamp);
                    } else if (msg.recipient === currentUsername) {
                        addMessage(`[DM from ${msg.sender}]: ${msg.content}`, 'private', msg.sender, msg.timestamp);
                    }
                } else {
                    addMessage(`${msg.sender}: ${msg.content}`, 'regular', msg.sender, msg.timestamp);
                }
            });

            const messagesDiv = document.getElementById('messages');
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        });

        socket.on('message', (data) => {
            if (data.media_url) {
                renderMediaMessage({
                    sender: data.username,
                    content: '',
                    media_url: data.media_url,
                    media_type: data.media_type,
                    timestamp: data.timestamp
                });
            } else {
                addMessage(`${data.username}: ${data.message}`, 'regular', data.username, data.timestamp);
            }
        });

        socket.on('private_message', (data) => {
            if (data.media_url) {
                renderMediaMessage({
                    sender: data.from,
                    content: '',
                    media_url: data.media_url,
                    media_type: data.media_type,
                    timestamp: data.timestamp
                }, 'private');
            } else {
                addMessage(`[DM from ${data.from}]: ${data.message}`, 'private', data.from, data.timestamp);
            }
        });

        socket.on('private_message_sent', (data) => {
            addMessage(`[DM to ${data.to}]: ${data.message}`, 'private', `to ${data.to}`, data.timestamp);
        });

        socket.on('user_joined', (data) => addMessage(data.message, 'system'));
        socket.on('user_left', (data) => addMessage(data.message, 'system'));
        socket.on('error', (data) => showChatError(data.message));

        function renderMediaMessage(msg, forceType = null) {
            const messagesDiv = document.getElementById('messages');
            const messageEl = document.createElement('div');
            const type = forceType || 'regular';

            messageEl.className = `message ${type}`;

            if (type === 'system') {
                messageEl.innerHTML = msg.content;
            } else {
                const label = (msg.sender || msg.from || 'Media');
                const mediaHtml = msg.media_type === 'video'
                    ? `<video class="media-preview" controls src="${msg.media_url}"></video>`
                    : `<img class="media-preview" src="${msg.media_url}" />`;

                messageEl.innerHTML = `<strong>> ${label}</strong><br>${mediaHtml}`;
                if (msg.timestamp) {
                    messageEl.innerHTML += `<div class="message-time">${msg.timestamp}</div>`;
                }
            }
            messagesDiv.appendChild(messageEl);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function showLoginError(msg) {
            const errorDiv = document.getElementById('loginError');
            errorDiv.textContent = '[ ERROR ] ' + msg;
            errorDiv.classList.add('show');
            setTimeout(() => errorDiv.classList.remove('show'), 3000);
        }

        function showChatError(msg) {
            const messagesDiv = document.getElementById('messages');
            const errorEl = document.createElement('div');
            errorEl.className = 'message system';
            errorEl.innerHTML = `<strong>> ERROR:</strong> ${msg}`;
            messagesDiv.appendChild(errorEl);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function addMessage(text, type = 'regular', user = '', time = '') {
            const messagesDiv = document.getElementById('messages');
            const messageEl = document.createElement('div');
            messageEl.className = `message ${type}`;

            if (type === 'system') {
                messageEl.innerHTML = `[ ${text} ]`;
            } else {
                messageEl.innerHTML = `<strong>> ${user}</strong><br>${text}`;
                if (time) {
                    messageEl.innerHTML += `<div class="message-time">${time}</div>`;
                }
            }

            messagesDiv.appendChild(messageEl);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function login() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();

            if (!username || !password) {
                showLoginError('Username and password required');
                return;
            }

            socket.emit('login', { username, password });
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            if (!message) return;

            socket.emit('message', { message });
            input.value = '';
            input.focus();
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        async function uploadMedia() {
            const fileInput = document.getElementById('mediaUpload');
            const file = fileInput.files[0];
            if (!file) return;

            const formData = new FormData();
            formData.append('file', file);

            try {
                const res = await fetch('/upload_media', {
                    method: 'POST',
                    body: formData
                });

                const data = await res.json();
                if (data.error) {
                    alert('[!] ' + data.error);
                    return;
                }

                socket.emit('message', {
                    message: '',
                    media_url: data.url,
                    media_type: data.resource_type
                });
                fileInput.value = '';
            } catch (err) {
                alert('[!] Upload failed: ' + err.message);
            }
        }

        function logout() {
            socket.disconnect();
            currentUsername = '';
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
            document.getElementById('messages').innerHTML = '';
            document.getElementById('loginSection').classList.add('active');
            document.getElementById('chatSection').classList.remove('active');
            socket.connect();
        }
    </script>
</body>
</html>
