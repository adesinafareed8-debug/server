<!DOCTYPE html>
<html>
<head>
    <title>Admin Login - Chat Server</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            width: 90%;
            max-width: 400px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            padding: 40px;
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 24px;
        }
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .question {
            background: #f0f0f0;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            font-weight: bold;
            color: #333;
            text-align: center;
            border-left: 4px solid #667eea;
        }
        form { display: flex; flex-direction: column; }
        input {
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.3);
        }
        button {
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background: #764ba2; }
        .error {
            background: #ffe0e0;
            color: #ff6b6b;
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 15px;
            display: none;
            text-align: center;
        }
        .error.show { display: block; }
        .footer {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: #999;
        }
        .footer a { color: #667eea; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 Admin Panel</h1>
        <p class="subtitle">Sign in with your administrator credentials</p>

        {% if error %}
        <div class="error show">{{ error }}</div>
        {% endif %}

        

        <form method="POST" action="/admin">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <input type="text" name="username" placeholder="Administrator username" autocomplete="username" required autofocus maxlength="64" />
            <input type="password" name="password" placeholder="Administrator password" autocomplete="current-password" required />
            <button type="submit">Sign in</button>
        </form>

        <div class="footer">
            <a href="/">← Back to Chat</a>
        </div>
    </div>
</body>
</html>
